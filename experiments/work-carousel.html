<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Work Carousel — Experiment</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap"/></noscript>

<style>
:root {
  --ink: #001C2F;
  --ink-2: #2B3A47;
  --ink-3: #5C6B77;
  --muted: #687B88;
  --red: #D1293D;
  --red-deep: #A92626;
  --paper: #FAF8F5;
  --paper-2: #F2EEE8;
  --rule: rgba(0, 28, 47, 0.08);
  --rule-strong: rgba(0, 28, 47, 0.16);
  --sans: 'Archivo', system-ui, sans-serif;
  --serif: 'Source Serif 4', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --morph: 680ms;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper-2);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
ul { margin: 0; padding: 0; list-style: none; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; }

.wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 56px; }
@media (max-width: 720px) { .wrap { padding: 0 24px; } }

/* ===== Page head ===== */
.page-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-top: 28px; padding-bottom: 28px;
}
.back { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--ink-3); }
.back:hover { color: var(--red); }
.page-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase; }

/* ===== Section head ===== */
.work { padding: 48px 0 96px; }
@media (max-width: 860px) { .work { padding: 32px 0 72px; } }

.section-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
  border-top: 1px solid var(--ink); padding-top: 24px;
  margin-bottom: 40px;
}
.section-title {
  font-family: var(--serif); font-weight: 400; font-style: italic;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.0; letter-spacing: -0.025em; color: var(--ink);
}
.section-title .dot { color: var(--red); font-style: normal; }

.head-controls { display: flex; align-items: center; gap: 14px; }
.counter {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--rule-strong); background: transparent; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 200ms ease, color 200ms ease, opacity 200ms ease, border-color 200ms ease;
}
.nav-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
@media (max-width: 720px) { .nav-btn { display: none; } }

/* ===== Morphing carousel =====
   The Logitech mechanic: every card shares one height but animates its WIDTH
   between a collapsed and an expanded value. The image inside is a fixed-size
   layer anchored to the frame's center, so a narrow card is a tight center
   crop and a growing card seamlessly reveals more of the same picture —
   the crop widens; the content never rescales or pans. */
.viewport {
  overflow: hidden;
  touch-action: pan-y;
  cursor: grab;
}
.viewport.is-dragging { cursor: grabbing; }
.viewport:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; border-radius: 4px; }

.track {
  display: flex;
  align-items: flex-start;
  gap: var(--gap, 24px);
  padding: 8px 0;
  transform: translate3d(0, 0, 0);
  transition: transform var(--morph) var(--ease);
  will-change: transform;
}
.carousel.no-anim .track,
.carousel.no-anim .slide { transition: none; }

.slide {
  flex: 0 0 auto;
  /* width set inline by JS; collapsed <-> expanded */
  transition: width var(--morph) var(--ease);
}

.card { margin: 0; }
.card-media {
  position: relative;
  height: var(--media-h, 300px);
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.card-media img {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: var(--img-w, 100%);
  max-width: none;
  height: 100%;
  object-fit: cover;
  opacity: 0.9;
  transition: opacity 320ms ease;
  -webkit-user-drag: none;
  user-select: none;
}
.slide.is-open .card-media img { opacity: 1; }
.card-media::after {
  /* hairline inset, kept off the img so it never clips the reveal */
  content: ""; position: absolute; inset: 0;
  border-radius: inherit; box-shadow: inset 0 0 0 1px var(--rule);
  pointer-events: none;
}

/* ===== Card text ===== */
/* Captions never fade during the morph — they ride their card, like the
   reference. The kicker's width follows the animating card so the year
   glides with the card's edge; the title's width is snapped (inline, no
   transition) to the card's TARGET width the instant a move starts, so any
   rewrap happens once, invisibly, as everything begins sliding. */
.card-text {
  margin-top: 18px;
  transition: opacity 180ms ease;
}
/* Mobile slivers stay image-only, like the reference; captions belong to
   the open card. Desktop keeps kicker + title on the collapsed neighbor. */
@media (max-width: 720px) {
  .slide:not(.is-open) .card-text { opacity: 0; }
}
.card-kicker {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin-bottom: 10px;
}
.card-role {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
}
.card-year { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--ink-3); white-space: nowrap; }
.card-title {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(22px, 2.2vw, 27px);
  line-height: 1.12; letter-spacing: -0.02em; color: var(--ink);
  margin-bottom: 10px;
}
.card-body {
  font-size: 14px; line-height: 1.6; color: var(--ink-2); max-width: 62ch;
  opacity: 0;
  transition: opacity 120ms ease;
}
/* The description belongs to the open card only. It pops in the instant a
   move starts (riding the morph like the titles, wrap width pre-snapped to
   the destination) and pops out just as fast on the outgoing card. */
.slide.is-open .card-body { opacity: 1; }

/* ===== Entrance cascade ===== */
.anim-item {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 640ms ease, transform 760ms var(--ease);
  transition-delay: var(--anim-delay, 0ms);
}
body.is-loaded .anim-item { opacity: 1; transform: none; }

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .card-text { opacity: 1 !important; }
  .slide.is-open .card-body { opacity: 1 !important; }
  .anim-item { opacity: 1 !important; transform: none !important; }
}
</style>
</head>
<body>

<header class="wrap page-head">
  <a class="back" href="../index.html">&larr; jtroll.com</a>
  <span class="page-tag">Experiment &mdash; Work Carousel v2</span>
</header>

<section class="work" aria-label="Selected work">
  <div class="wrap section-head anim-item" style="--anim-delay: 0ms">
    <h2 class="section-title">Work<span class="dot">.</span></h2>
    <div class="head-controls">
      <span class="counter" id="counter" aria-live="polite">01 / 10</span>
      <button class="nav-btn" id="prev" type="button" aria-label="Previous project" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M9 2.5L4.5 7L9 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="nav-btn" id="next" type="button" aria-label="Next project">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5 2.5L9.5 7L5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="carousel anim-item" id="carousel" style="--anim-delay: 120ms">
    <div class="viewport" id="viewport" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Work projects">
      <ul class="track" id="track">
        <!-- slides injected by JS -->
      </ul>
    </div>
  </div>
</section>

<script>
(function() {
  var projects = [
    { img: '../assets/work_sofi.webp', w: 1162, h: 776, year: '2024 — NOW', role: 'Sr. Director of Design', title: 'SoFi, Member Group Business Unit', body: "Leading product & content design across SoFi's horizontal group business unit spanning AI-in-product, navigation, premium features, growth and personal finance management." },
    { img: '../assets/work_cruise.webp', w: 1160, h: 772, year: '2023', role: 'Head of Ridehail Design', title: 'Cruise', body: "Head of product design for the ridehail consumer experience of Cruise, one of the foremost autonomous vehicle companies at the time. Responsible for 80% of the company's business, from in-car to app experiences. Spanned three vehicle platforms, a 13-city scaling plan, our apps and IVI." },
    { img: '../assets/work_rl.webp', w: 1740, h: 1158, year: '2021–23', role: 'Head of XD', title: 'Neural interfaces (AR)', body: "Head of Experiences Design for new neural interfaces product lines — and 5 new teams around them — within Meta's Augmented Reality division, creating the next great input mechanic and consumer devices. 12+ patents in novel inputs." },
    { img: '../assets/work_campus.webp', w: 1740, h: 1158, year: '2020–21', role: 'Founding Design Manager', title: 'Facebook Campus', body: "Supported a comprehensive new community product for college students within Facebook's Community Incubator. Launched its North American beta summer 2020 with 30 US universities, ramping to many more and exceeding our launch metric goals." },
    { img: '../assets/work_neighborhoods.webp', w: 1740, h: 1158, year: '2020', role: 'Founding Design Manager', title: 'Facebook Neighborhoods', body: "Founding design manager for another new community product, for local neighborhoods. Launched its North American beta fall 2020, and in the process build several novel features comprising a more comprehensive tool set for all Facebook group admins." },
    { img: '../assets/work_events.webp', w: 1740, h: 1158, year: '2017–19', role: 'Design Manager', title: 'Events & Local', body: "For 3 years I supported the Facebook Local product ecosystem and the Facebook Local app. Oversaw an increase to 700M consumers & 120K creators per month as the world's largest events and \"things to do\" platform. I oversaw 12+ major new feature & service launches, including an all-new social map & data later still used company-wide. Before the pandemic Facebook Local eclipsed Yelp in the US for stickiness and MAU." },
    { img: '../assets/work_communityintegrity.webp', w: 1740, h: 1158, year: '2014–17', role: 'Design Lead', title: 'Community Integrity', body: "Design lead across all Facebook Consumer Support tools, including reporting and the global Help Center. Established industry-leading best practices for the time that scaled across 120 languages and created all-new ML-powered content recognition, response, and chatbot help products." },
    { img: '../assets/work_coreexperiences.webp', w: 1740, h: 1158, year: '2013–14', role: 'Designer', title: 'Core Experiences', body: "Designed core systems for Facebook — News Feed, rich engagement features, emerging-market support. Co-designed the first comprehensive component-based design library for the Facebook app on Android, and shipped the first rich comments (stickers)." },
    { img: '../assets/work_mada.webp', w: 1160, h: 772, year: '2016–2021', role: 'Founding Designer', title: 'Make America Dinner Again', body: "Founding designer for this national volunteer organization, fostering better communication across the aisle leveraging over 12 national chapters in 20 cities. Coverage in NYT, the BBC, Glenn Beck, Oprah, CNN, NPR, and other national & international media." },
    { img: '../assets/work_08_prefacebook.webp', w: 1740, h: 1158, year: 'Pre-2013', role: 'IDEO + startups', title: 'Pre-Meta', body: "Co-founded two start-ups in local discovery and social creation tools, ran a small design consultancy, and had a career in design agency life before that through places like IDEO." }
  ];

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var track = document.getElementById('track');
  var counter = document.getElementById('counter');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  track.innerHTML = projects.map(function(p, i) {
    var loadAttrs = i < 3 ? 'loading="eager"' + (i === 0 ? ' fetchpriority="high"' : '') : 'loading="lazy"';
    return '<li class="slide" role="group" aria-roledescription="slide" aria-label="' + (i + 1) + ' of ' + projects.length + '">' +
      '<figure class="card">' +
        '<div class="card-media">' +
          '<img src="' + p.img + '" alt="' + esc(p.title) + '" width="' + p.w + '" height="' + p.h + '" ' + loadAttrs + ' decoding="async" draggable="false"/>' +
        '</div>' +
        '<figcaption class="card-text">' +
          '<p class="card-kicker"><span class="card-role">' + esc(p.role) + '</span><span class="card-year">' + esc(p.year) + '</span></p>' +
          '<h3 class="card-title">' + esc(p.title) + '</h3>' +
          '<p class="card-body">' + esc(p.body) + '</p>' +
        '</figcaption>' +
      '</figure>' +
    '</li>';
  }).join('');

  var slides = Array.prototype.slice.call(track.children);
  var titles = slides.map(function(s) { return s.querySelector('.card-title'); });
  var bodies = slides.map(function(s) { return s.querySelector('.card-body'); });
  var N = slides.length;
  var index = 0;

  /* ----- Geometry ---------------------------------------------------------
     All widths are computed in px here (single source of truth) and animated
     by the CSS transitions on .slide (width) and .track (transform).
     m = { exp, col, gap, pad, step, mediaH } */
  var m = {};

  function measure() {
    var vw = document.documentElement.clientWidth;
    var mobile = vw <= 720;
    if (mobile) {
      m.gap = 12;
      m.exp = Math.round(vw - 80);              // slivers of both neighbors visible
      m.col = Math.round(vw * 0.58);
      m.pad = Math.round((vw - m.exp) / 2);     // open card centered
      m.mediaH = Math.round(m.exp * 0.72);
    } else {
      var gutter = Math.max(56, (vw - 1280) / 2 + 56);
      var inner = vw - gutter * 2;
      m.gap = 24;
      m.exp = Math.round(inner * 0.70);         // main card: one dominant primary
      m.col = Math.round(inner * 0.30);         // the secondary; third card barely peeks
      m.pad = Math.round(gutter);               // open card sits on the grid's left edge
      // Native 3:2 frame, so the open card shows the full picture uncropped;
      // collapsed cards are center crops of that same rendering.
      m.mediaH = Math.round(m.exp / 1.5);
    }
    m.step = m.col + m.gap;                     // how far the track shifts per index
    carousel.style.setProperty('--gap', m.gap + 'px');
    carousel.style.setProperty('--media-h', m.mediaH + 'px');
    // The image layer is sized for the EXPANDED frame and never resizes with
    // the card, so collapsed cards are center crops of the same rendering.
    carousel.style.setProperty('--img-w', Math.max(m.exp, Math.round(m.mediaH * 1.5)) + 'px');
  }

  function offsetFor(i) { return m.pad - i * m.step; }

  /* The unit's height is fixed to the tallest card measured at the EXPANDED
     width, so paginating between long and short descriptions never shifts
     the content below. The viewport's overflow:hidden clips the layout-only
     (invisible) description text of collapsed cards. */
  function lockHeight() {
    for (var i = 0; i < N; i++) {
      slides[i].style.width = m.exp + 'px';
      titles[i].style.width = m.exp + 'px';
      bodies[i].style.width = m.exp + 'px';
    }
    var h = 0;
    for (var i = 0; i < N; i++) h = Math.max(h, slides[i].offsetHeight);
    viewport.style.height = (h + 16) + 'px'; // + track's vertical padding
  }

  function widthFor(i) { return i === index ? m.exp : m.col; }

  /* ----- Settle / moving state ------------------------------------------- */
  var settleTimer = null;
  function startMoving() {
    carousel.classList.add('is-moving');
    if (settleTimer) clearTimeout(settleTimer);
    // Fallback in case transitionend is swallowed (e.g. reduced motion).
    settleTimer = setTimeout(settle, 900);
  }
  function settle() {
    if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
    carousel.classList.remove('is-moving');
  }
  track.addEventListener('transitionend', function(e) {
    if (e.target === track && e.propertyName === 'transform') settle();
  });

  function render() {
    for (var i = 0; i < N; i++) {
      slides[i].style.width = widthFor(i) + 'px';
      // Title/body wrap widths snap straight to the target (no transition), so
      // the one possible rewrap happens the instant motion starts, not during it.
      titles[i].style.width = widthFor(i) + 'px';
      bodies[i].style.width = widthFor(i) + 'px';
      slides[i].classList.toggle('is-open', i === index);
    }
    track.style.transform = 'translate3d(' + offsetFor(index) + 'px, 0, 0)';
    counter.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0');
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === N - 1;
  }

  function goTo(i, animate) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === index && animate !== false) return;
    index = i;
    if (animate === false || reduceMotion.matches) {
      carousel.classList.add('no-anim');
      render();
      // Flush styles so re-enabling transitions doesn't animate this change.
      void track.offsetWidth;
      carousel.classList.remove('no-anim');
      settle();
    } else {
      startMoving();
      render();
    }
  }

  /* ----- Drag / swipe: scrub the morph with the finger -------------------
     While dragging, the outgoing and incoming widths (and the track offset)
     are interpolated 1:1 with the gesture, then released to the CSS
     transition for the settle. */
  var drag = null; // {startX, startY, active, lastX, lastT, v, p, dir}

  function setScrub(dir, p) {
    // dir: +1 toward next, -1 toward prev; p in [0,1]
    var j = index + dir;
    for (var i = 0; i < N; i++) {
      var w = i === index ? m.exp - (m.exp - m.col) * p
            : i === j     ? m.col + (m.exp - m.col) * p
            : m.col;
      slides[i].style.width = w + 'px';
    }
    track.style.transform = 'translate3d(' + (offsetFor(index) - dir * p * m.step) + 'px, 0, 0)';
  }

  viewport.addEventListener('dragstart', function(e) { e.preventDefault(); });

  viewport.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { startX: e.clientX, startY: e.clientY, active: false, lastX: e.clientX, lastT: e.timeStamp, v: 0, p: 0, dir: 0 };
  });

  viewport.addEventListener('pointermove', function(e) {
    if (!drag) return;
    var dx = e.clientX - drag.startX;
    var dy = e.clientY - drag.startY;
    if (!drag.active) {
      if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy)) return; // let vertical scroll through
      drag.active = true;
      viewport.setPointerCapture(e.pointerId);
      viewport.classList.add('is-dragging');
      carousel.classList.add('no-anim');
      startMoving();
      if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; } // no settle while held
    }
    var dt = e.timeStamp - drag.lastT;
    if (dt > 0) drag.v = (e.clientX - drag.lastX) / dt;
    drag.lastX = e.clientX; drag.lastT = e.timeStamp;

    var dir = dx < 0 ? 1 : -1;
    var j = index + dir;
    var p;
    if (j < 0 || j >= N) {
      p = Math.min(0.10, Math.abs(dx) / m.step * 0.10); // end-of-row resistance
    } else {
      p = Math.min(1, Math.abs(dx) / m.step);
    }
    drag.dir = dir; drag.p = p;
    setScrub(dir, p);
  });

  var suppressClick = false;
  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.active) return;
    suppressClick = true;
    viewport.classList.remove('is-dragging');
    carousel.classList.remove('no-anim');
    var j = index + d.dir;
    var commit = j >= 0 && j < N && (d.p > 0.35 || (d.dir === 1 ? d.v < -0.5 : d.v > 0.5));
    startMoving();
    if (commit) index = j;
    render();
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  // Swallow the click that follows a drag; let taps on side cards navigate.
  viewport.addEventListener('click', function(e) {
    if (suppressClick) {
      suppressClick = false;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    var slide = e.target.closest ? e.target.closest('.slide') : null;
    if (!slide) return;
    var i = slides.indexOf(slide);
    if (i !== -1 && i !== index) { e.preventDefault(); goTo(i); }
  });

  /* ----- Buttons, keyboard, trackpad ------------------------------------- */
  prevBtn.addEventListener('click', function() { goTo(index - 1); });
  nextBtn.addEventListener('click', function() { goTo(index + 1); });

  viewport.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(index - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(N - 1); }
  });

  // Horizontal trackpad swipes advance one card per gesture.
  var wheelAcc = 0, wheelIdle = null, wheelLocked = false;
  viewport.addEventListener('wheel', function(e) {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    if (wheelLocked) return;
    wheelAcc += e.deltaX;
    if (wheelIdle) clearTimeout(wheelIdle);
    wheelIdle = setTimeout(function() { wheelAcc = 0; wheelLocked = false; }, 180);
    if (Math.abs(wheelAcc) > 90) {
      wheelLocked = true;
      goTo(index + (wheelAcc > 0 ? 1 : -1));
      wheelAcc = 0;
    }
  }, { passive: false });

  /* ----- Boot / resize ---------------------------------------------------- */
  var resizeRaf = null;
  window.addEventListener('resize', function() {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(function() {
      resizeRaf = null;
      measure();
      carousel.classList.add('no-anim');
      lockHeight();
      render();
      void track.offsetWidth;
      carousel.classList.remove('no-anim');
    });
  });

  measure();
  carousel.classList.add('no-anim');
  lockHeight();
  render();
  void track.offsetWidth;
  carousel.classList.remove('no-anim');

  // Text metrics shift once the webfonts arrive; re-lock the height then.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() {
      carousel.classList.add('no-anim');
      lockHeight();
      render();
      void track.offsetWidth;
      carousel.classList.remove('no-anim');
    });
  }

  // Warm neighbors so the first morph reveals decoded pixels.
  [1, 2].forEach(function(i) {
    if (!projects[i]) return;
    var im = new Image();
    im.src = projects[i].img;
    if (im.decode) im.decode().catch(function() {});
  });

  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      document.body.classList.add('is-loaded');
    });
  });
})();
</script>
</body>
</html>
