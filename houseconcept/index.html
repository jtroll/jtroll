<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>House concept · J.T. Trollman</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#263b38;background:#f5f4ee;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px}
    main{width:min(100%,440px)}.mark{width:52px;height:52px;margin-bottom:32px;color:#8c543c}
    .eyebrow{font-size:11px;font-weight:650;letter-spacing:2px;text-transform:uppercase;color:#697a70}
    h1{font-size:38px;font-weight:550;letter-spacing:-1.4px;margin:14px 0}p{font-size:15px;line-height:1.65;color:#63716a}
    form{margin-top:30px}label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}
    .field{display:flex;border:1px solid #b9c3b9;border-radius:9px;background:white;overflow:hidden}
    input{width:100%;min-width:0;border:0;padding:15px;font:inherit;color:#263b38;background:transparent;outline:none}
    .field:focus-within{outline:3px solid #b87a55;outline-offset:3px}button{cursor:pointer;font:inherit}
    #show{border:0;background:transparent;color:#50665b;font-size:12px;padding:0 16px}
    #unlock{margin-top:14px;width:100%;padding:15px;border:0;border-radius:9px;background:#29483e;color:#fff;font-weight:600;font-size:14px}
    #unlock:hover{background:#355a4d}button:focus-visible,a:focus-visible{outline:3px solid #b87a55;outline-offset:3px}
    button:disabled{opacity:.65;cursor:wait}#message{min-height:25px;font-size:13px;margin:14px 0 0;color:#52665c}
    #message.error{color:#a33125}progress{width:100%;height:7px;accent-color:#8c543c;margin:18px 0 0}
    .note{font-size:12px;line-height:1.7;margin-top:27px;color:#718077}footer{margin-top:40px;border-top:1px solid #d9dfd4;padding-top:20px;font-size:12px}
    footer a{color:#586e61;text-decoration:none}footer a:hover{text-decoration:underline}[hidden]{display:none!important}
    @media(max-width:480px){body{padding:25px}h1{font-size:34px}.mark{margin-bottom:22px}}
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 45V23L26 8l18 15v22H8Z"/><path d="M21 45V30h10v15M3 26 26 6l23 20M13 17V8h7"/></svg>
    <div class="eyebrow">Friends &amp; family</div>
    <h1>House concept.</h1>
    <p>A work in progress.<br>Come explore the house as it is today, and what we're imagining next.</p>
    <form id="login">
      <label for="password">Password</label>
      <div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="none" aria-describedby="message"><button id="show" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
      <button id="unlock" type="submit">Explore the house</button>
    </form>
    <progress id="progress" max="100" value="0" hidden aria-label="House download progress"></progress>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="note">A computer works best for exploring and walking through the house. The first visit downloads about <span id="size">221</span> MB; Wi-Fi is recommended.</p>
    <footer><a href="/">← Back to jtroll.com</a></footer>
    <noscript><p>JavaScript is needed to unlock and explore the house.</p></noscript>
  </main>
  <script src="portal.js" defer></script>
</body>
</html>
